<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f8f4e">
<title>Matchstick Puzzle</title>
<meta name="description" content="Move matchsticks to fix equations, numbers and shapes. Free on Android and iPhone.">
<meta property="og:type" content="website">
<meta property="og:title" content="Matchstick Puzzle">
<meta property="og:description" content="Move matchsticks to fix equations, numbers and shapes. Free on Android and iPhone.">
<meta property="og:image" content="https://vishnuv2311.github.io/matchstick/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Matchstick Puzzle">
<meta name="twitter:description" content="Move matchsticks to fix equations, numbers and shapes. Free on Android and iPhone.">
<meta name="twitter:image" content="https://vishnuv2311.github.io/matchstick/og.png">
<!-- Store link for X posts (docs/x_posting.md): ?c=level-12 tags the install
     with the level. Phones go straight to their store; computers see both. -->
<style>
:root { --bg: #eef7e8; --card: #ffffff; --ink: #2b1d12; --mute: #6b5a4b; --green: #2f8f4e; --line: #e3d9cc; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #101410; --card: #1b211b; --ink: #f1ebe2; --mute: #b3a796; --line: #313a31; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font: 17px/1.45 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; padding: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px 20px; max-width: 420px; width: 100%; text-align: center; }
.card img { width: 112px; height: 112px; border-radius: 26px; }
h1 { font-size: 26px; margin: 14px 0 4px; }
p { color: var(--mute); margin: 0 0 20px; }
a.store { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; margin-top: 10px;
  background: var(--green); color: #fff; font-weight: 800; text-decoration: none; }
a.store.alt { background: transparent; color: var(--ink); border: 2px solid var(--line); }
</style>
</head>
<body>
<main class="card">
  <img src="../icon.png" alt="Matchstick Puzzle icon" width="112" height="112">
  <h1>Matchstick Puzzle</h1>
  <p>Move matchsticks to fix equations, numbers and shapes. Hundreds of levels and a daily challenge.</p>
  <a class="store" id="play" href="https://play.google.com/store/apps/details?id=dev.vishnuv.matchstickpuzzle">Get it on Google Play</a>
  <a class="store alt" id="ios" href="https://apps.apple.com/app/id6822315747">Download on the App Store</a>
</main>
<script>
"use strict";
// App Store Connect > Analytics campaign links need the provider token (pt);
// fill it in to see installs per level there. Empty = plain App Store link.
const APP_STORE_PT = "";
const campaign = ((new URLSearchParams(location.search).get("c") || "").toLowerCase().match(/^[a-z0-9-]{1,40}$/) || ["x"])[0];
const play = document.getElementById("play");
const ios = document.getElementById("ios");
play.href += "&referrer=" + encodeURIComponent("utm_source=x&utm_medium=social&utm_campaign=" + campaign);
if (APP_STORE_PT) ios.href += "?pt=" + APP_STORE_PT + "&ct=" + encodeURIComponent("x-" + campaign) + "&mt=8";
const ua = navigator.userAgent;
const isIos = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
if (/Android/i.test(ua)) location.replace(play.href);
else if (isIos) location.replace(ios.href);
</script>
</body>
</html>
